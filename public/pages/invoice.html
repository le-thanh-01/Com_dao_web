<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Xác nhận hoá đơn - 4S Cơm đảo Bách Khoa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #fbfaf7;
      }

      body {
        font-family: "Be Vietnam Pro", "Segoe UI", sans-serif;
        color: #1a1a18;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border: 1px solid #d4d2cc;
        border-radius: 12px;
        padding: 44px 32px 36px;
        box-shadow:
          0 12px 32px rgba(26, 26, 24, 0.04),
          0 4px 12px rgba(26, 26, 24, 0.02);
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: #c8a96e;
      }
      .card.has-error::before {
        background: #d64f3c;
      }

      .icon-wrap {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(200, 169, 110, 0.12);
        transition: background 0.2s ease;
      }

      .icon-wrap.is-error {
        background: rgba(214, 79, 60, 0.1);
      }

      .spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid #e5e3de;
        border-top-color: #c8a96e;
        animation: spin 0.8s cubic-bezier(0.4, 0.1, 0.2, 1) infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .icon-wrap svg {
        width: 32px;
        height: 32px;
        display: block;
      }

      h1 {
        font-family: "Playfair Display", serif;
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 10px;
        color: #1a1a18;
        letter-spacing: -0.01em;
      }

      p.desc {
        font-size: 14px;
        line-height: 1.55;
        color: #6e6c67;
        margin: 0 0 26px;
        padding: 0 4px;
      }

      .details {
        text-align: left;
        background: #f2f0eb;
        border: 1px solid #d4d2cc;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 13.5px;
        color: #6e6c67;
        margin: 0 0 26px;
        word-break: break-word;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .details span {
        color: #1a1a18;
        font-weight: 600;
        font-family: monospace;
        font-size: 14px;
      }

      /* Wrapper khối hành động chứa Button */
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        width: 100%;
        margin-top: 8px;
      }

      button {
        font-family: "Be Vietnam Pro", "Segoe UI", sans-serif;
        font-size: 14px;
        font-weight: 600;
        border-radius: 8px;
        padding: 12px 24px;
        flex: 1;
        cursor: pointer;
        outline: none;
        border: 1px solid transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
      }

      /* Nút Primary */
      .btn-primary {
        background: #c8a96e;
        border-color: #c8a96e;
        color: #ffffff !important;
      }
      .btn-primary:hover {
        background: #d4b87a;
        border-color: #d4b87a;
      }

      /* SỬA LỖI MẤT CHỮ: Cố định màu chữ tối trên nền sáng nhẹ thương hiệu */
      .btn-secondary {
        background: #f2f0eb !important;
        border: 1px solid #d4d2cc !important;
        color: #1a1a18 !important;
      }
      .btn-secondary:hover {
        background: #e5e3de !important;
        border-color: #a3a19c !important;
        color: #1a1a18 !important;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body class="light">
    <div class="card" id="card">
      <div class="icon-wrap" id="iconWrap">
        <div class="spinner" id="spinner"></div>
      </div>

      <h1 id="title">Đang chờ xác thực</h1>
      <p class="desc" id="desc">
        Vui lòng đợi trong giây lát, trang đang chờ nhận dữ liệu xác thực từ ứng
        dụng.
      </p>

      <div class="details hidden" id="details"></div>
      <div class="actions hidden" id="actions"></div>
    </div>

    <script>
      (function () {
        let PARENT_ORIGIN = window.location.origin;
        let DEFAULT_BASE_URL =
          localStorage.getItem("url") ??
          "https://pending-dem-personals-residence.trycloudflare.com";

        let TIMEOUT_MS = 15000;
        let hasReceivedData = false;
        let waitTimeoutId = null;
        let lastParams = null;

        let els = {
          card: document.getElementById("card"),
          iconWrap: document.getElementById("iconWrap"),
          title: document.getElementById("title"),
          desc: document.getElementById("desc"),
          details: document.getElementById("details"),
          actions: document.getElementById("actions"),
        };

        let ICONS = {
          success:
            '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
            '<path d="M5 13l4 4L19 7" stroke="#c8a96e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>' +
            "</svg>",
          error:
            '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
            '<path d="M6 6l12 12M18 6L6 18" stroke="#d64f3c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>' +
            "</svg>",
        };

        function clearActions() {
          els.actions.innerHTML = "";
          els.actions.classList.add("hidden");
        }

        function addAction(label, onClick, variant) {
          let btn = document.createElement("button");
          btn.textContent = label;
          btn.className =
            variant === "primary" ? "btn-primary" : "btn-secondary";
          btn.addEventListener("click", onClick);
          els.actions.appendChild(btn);
          els.actions.classList.remove("hidden");
        }

        function renderIdle() {
          els.card.classList.remove("has-error");
          els.iconWrap.classList.remove("is-error");
          els.iconWrap.innerHTML = '<div class="spinner"></div>';
          els.title.textContent = "Đang chờ xác thực";
          els.desc.textContent =
            "Vui lòng đợi trong giây lát, trang đang chờ nhận dữ liệu xác thực từ ứng dụng.";
          els.details.classList.add("hidden");
          clearActions();
        }

        function renderLoading() {
          els.card.classList.remove("has-error");
          els.iconWrap.classList.remove("is-error");
          els.iconWrap.innerHTML = '<div class="spinner"></div>';
          els.title.textContent = "Đang xử lý yêu cầu";
          els.desc.textContent =
            "Đang gửi yêu cầu lấy hoá đơn, vui lòng không đóng cửa sổ này.";
          els.details.classList.add("hidden");
          clearActions();
        }

        function renderSuccess(id) {
          els.card.classList.remove("has-error");
          els.iconWrap.classList.remove("is-error");
          els.iconWrap.innerHTML = ICONS.success;
          els.title.textContent = "Yêu cầu hoá đơn thành công";
          els.desc.textContent =
            "Hệ thống đã xử lý hoá đơn của bạn thành công.";
          els.details.innerHTML =
            "Mã đơn hàng <span>" + escapeHtml(String(id)) + "</span>";
          els.details.classList.remove("hidden");
          clearActions();
          addAction(
            "Đóng",
            function () {
              window.close();
            },
            "primary",
          );
        }

        function renderError(message, allowRetry) {
          els.card.classList.add("has-error");
          els.iconWrap.classList.add("is-error");
          els.iconWrap.innerHTML = ICONS.error;
          els.title.textContent = "Không thể lấy hoá đơn";
          els.desc.textContent =
            message || "Đã có lỗi xảy ra, vui lòng thử lại.";
          els.details.classList.add("hidden");
          clearActions();
          if (allowRetry) {
            addAction(
              "Thử lại",
              function () {
                if (lastParams)
                  fetchInvoice(
                    lastParams.token,
                    lastParams.id,
                    lastParams.baseUrl,
                  );
              },
              "primary",
            );
            addAction(
              "Đóng",
              function () {
                window.close();
              },
              "secondary",
            );
          } else {
            addAction(
              "Đóng",
              function () {
                window.close();
              },
              "primary",
            );
          }
        }

        function escapeHtml(str) {
          let div = document.createElement("div");
          div.textContent = str;
          return div.innerHTML;
        }

        function notifyOpener(success, payload) {
          if (window.opener) {
            try {
              window.opener.postMessage(
                { type: "INVOICE_RESULT", success: success, payload: payload },
                PARENT_ORIGIN,
              );
            } catch (e) {}
          }
        }

        function fetchInvoice(token, id, baseUrl) {
          renderLoading();
          let url =
            (baseUrl || DEFAULT_BASE_URL) +
            "/api/v1/order/invoice?id=" +
            encodeURIComponent(id);

          fetch(url, {
            method: "GET",
            headers: {
              Authorization: "Bearer " + token,
              Accept: "application/json",
            },
          })
            .then(function (res) {
              if (res.status >= 200 && res.status < 300) {
                return res
                  .json()
                  .catch(function () {
                    return null;
                  })
                  .then(function (data) {
                    renderSuccess(id);
                    notifyOpener(true, data);
                  });
              }
              let message = "Yêu cầu thất bại (mã lỗi " + res.status + ").";
              renderError(message, true);
              notifyOpener(false, { status: res.status });
            })
            .catch(function (err) {
              renderError(
                "Không thể kết nối tới máy chủ. Vui lòng kiểm tra đường truyền.",
                true,
              );
              notifyOpener(false, { error: String(err) });
            });
        }

        function handleMessage(event) {
          if (event.origin !== PARENT_ORIGIN) return;
          let data = event.data;
          if (!data || data.type !== "INVOICE_AUTH") return;
          if (hasReceivedData) return;

          hasReceivedData = true;
          if (waitTimeoutId) clearTimeout(waitTimeoutId);

          let token = data.token;
          let id = data.id;
          let baseUrl = data.baseUrl;

          if (!token || !id) {
            renderError("Thiếu dữ liệu xác thực (token hoặc id).", false);
            notifyOpener(false, { error: "missing_params" });
            return;
          }

          lastParams = { token: token, id: id, baseUrl: baseUrl };
          fetchInvoice(token, id, baseUrl);
        }

        window.addEventListener("message", handleMessage);

        window.addEventListener("load", function () {
          renderIdle();
          if (window.opener) {
            try {
              window.opener.postMessage(
                { type: "INVOICE_READY" },
                PARENT_ORIGIN,
              );
            } catch (e) {}
          }

          waitTimeoutId = setTimeout(function () {
            if (!hasReceivedData) {
              renderError(
                "Không nhận được dữ liệu xác thực từ ứng dụng chính.",
                false,
              );
            }
          }, TIMEOUT_MS);
        });
      })();
    </script>
  </body>
</html>
